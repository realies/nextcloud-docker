name: Update Nextcloud Docker Images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
    steps:
      - name: Detect image:tag combinations with ffmpeg support
        id: set-matrix
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          supports_ffmpeg() {
            local arch="$1"
            local is_alpine="$2"
            if [ "$is_alpine" = "true" ]; then
              case "$arch" in
                linux/386|linux/amd64|linux/arm/v6|linux/arm/v7|linux/arm64/v8|linux/ppc64le|linux/riscv64|linux/s390x)
                  return 0
                  ;;
              esac
            else
              case "$arch" in
                linux/386|linux/amd64|linux/arm/v5|linux/arm/v7|linux/arm64/v8|linux/ppc64le|linux/s390x)
                  return 0
                  ;;
              esac
            fi

            return 1
          }

          build_combinations=()
          fetch_tags() {
            local url="$1"
            local aggregate_file
            aggregate_file=$(mktemp)
            echo '{"results":[]}' > "$aggregate_file"

            while [ -n "$url" ] && [ "$url" != "null" ]; do
              local page_file
              page_file=$(mktemp)
              curl -fsSL "$url" -o "$page_file"
              jq -s '{results: (.[0].results + .[1].results)}' "$aggregate_file" "$page_file" > "${aggregate_file}.next"
              mv "${aggregate_file}.next" "$aggregate_file"
              url=$(jq -r '.next // ""' "$page_file")
            done

            cat "$aggregate_file"
          }

          upstream_tags=$(fetch_tags "https://hub.docker.com/v2/repositories/library/nextcloud/tags?page_size=100")
          own_tags=$(fetch_tags "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/nextcloud/tags?page_size=100" || echo '{"results":[]}')

          # README promises non-versioned tags only; official versioned tags start with a number.
          mapfile -t tag_records < <(jq -c '.results[] | select((.tag_status // "active") == "active") | select(.name | test("^[0-9]+([.-].*)?$") | not)' <<< "$upstream_tags")

          for tag_record in "${tag_records[@]}"; do
            tag=$(jq -r '.name' <<< "$tag_record")
            base_digest=$(jq -r '.digest // ""' <<< "$tag_record")
            upstream_last_updated=$(jq -r '.last_updated // ""' <<< "$tag_record")
            own_last_updated=$(jq -r --arg tag "$tag" '.results[]? | select((.tag_status // "active") == "active") | select(.name == $tag) | .last_updated // ""' <<< "$own_tags" | head -n 1)

            if [ -z "$base_digest" ] || [ "$base_digest" = "null" ]; then
              echo "Skipping tag: $tag (Docker Hub tag metadata has no digest)"
              continue
            fi
            if [ -z "$upstream_last_updated" ] || [ "$upstream_last_updated" = "null" ]; then
              echo "Docker Hub tag metadata is missing last_updated for nextcloud:$tag"
              echo "$tag_record"
              exit 1
            fi

            if [[ -n "$own_last_updated" && "$own_last_updated" != "null" ]] &&
              [[ "$own_last_updated" > "$upstream_last_updated" || "$own_last_updated" == "$upstream_last_updated" ]]; then
              echo "Skipping tag: $tag (target image is newer than upstream)"
              continue
            fi

            echo "Processing tag: $tag"
            # Get all architectures from Docker Hub tag metadata.
            all_archs=$(jq -r '.images[]? | select(.status == "active") | select(.os != "unknown" and .architecture != "unknown") | .os + "/" + .architecture + if .variant then "/" + .variant else "" end' <<< "$tag_record" | sort | uniq)

            # Determine if alpine or debian based
            is_alpine="false"
            if echo "$tag" | grep -q "alpine"; then
              is_alpine="true"
            fi

            # Filter architectures based on known ffmpeg package availability.
            supported_archs=()
            for arch in $all_archs; do
              if supports_ffmpeg "$arch" "$is_alpine"; then
                supported_archs+=("$arch")
              fi
            done

            if [ ${#supported_archs[@]} -gt 0 ]; then
              platforms=$(IFS=,; echo "${supported_archs[*]}")
              build_combinations+=("$(jq -cn --arg tag "$tag" --arg platforms "$platforms" --arg base_digest "$base_digest" '{tag:$tag,platforms:$platforms,base_digest:$base_digest}')")
              echo "  → $tag: ${#supported_archs[@]} architectures"
            else
              echo "  → $tag: No supported architectures, skipping"
            fi
          done
          echo "build_matrix={\"include\":[$(IFS=,; echo "${build_combinations[*]}")]}" >> $GITHUB_OUTPUT

  build:
    needs: detect
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.build_matrix != '{"include":[]}' }}
    strategy:
      matrix: ${{fromJson(needs.detect.outputs.build_matrix)}}
      fail-fast: false
      max-parallel: 2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.3

      - name: Login to DockerHub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Platforms and Publish Manifest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/nextcloud
          TAG: ${{ matrix.tag }}
          PLATFORMS: ${{ matrix.platforms }}
          BASE_DIGEST: ${{ matrix.base_digest }}
        run: |
          IFS=',' read -r -a expected_platforms <<< "$PLATFORMS"
          mkdir -p /tmp/descriptors
          normalize_platform() {
            case "$1" in
              linux/arm64/v8)
                echo "linux/arm64"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          for platform in "${expected_platforms[@]}"; do
            platform_slug="${platform//\//-}"
            metadata_file="/tmp/metadata-${platform_slug}.json"
            descriptor_file="/tmp/descriptors/${platform_slug}.json"

            for attempt in {1..5}; do
              if docker buildx build \
                --build-arg IMAGE=nextcloud \
                --build-arg "TAG=${TAG}" \
                --file Dockerfile \
                --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
                --output "type=image,name=${REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
                --platform "$platform" \
                --provenance=false \
                --sbom=false \
                --metadata-file "$metadata_file" \
                .; then
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Build failed for $TAG on $platform after $attempt attempts"
                exit 1
              fi

              sleep_seconds=$((attempt * 120))
              echo "Build failed for $TAG on $platform at attempt $attempt; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            done

            jq -e '."containerimage.descriptor"' "$metadata_file" > "$descriptor_file"
            digest=$(jq -r '.digest // ""' "$descriptor_file")
            media_type=$(jq -r '.mediaType // ""' "$descriptor_file")
            size=$(jq -r '.size // ""' "$descriptor_file")
            descriptor_platform=$(jq -r '.platform | [.os, .architecture, .variant // empty] | join("/")' "$descriptor_file")
            if [ -z "$digest" ] || [ -z "$media_type" ] || [ -z "$size" ] || [ -z "$descriptor_platform" ]; then
              echo "Build did not produce a complete image descriptor for $TAG on $platform"
              cat "$descriptor_file"
              exit 1
            fi
            if [ "$(normalize_platform "$descriptor_platform")" != "$(normalize_platform "$platform")" ]; then
              echo "Descriptor platform mismatch for $TAG: expected $platform, got $descriptor_platform"
              cat "$descriptor_file"
              exit 1
            fi
            echo "Exported $descriptor_platform descriptor: $digest"
            docker buildx prune -af || true
          done

          mapfile -t descriptor_files < <(find /tmp/descriptors -type f -name '*.json' | sort)
          if [ ${#descriptor_files[@]} -eq 0 ]; then
            echo "No image descriptors found for $TAG"
            exit 1
          fi
          if [ ${#descriptor_files[@]} -ne ${#expected_platforms[@]} ]; then
            echo "Expected ${#expected_platforms[@]} image descriptors for $TAG ($PLATFORMS), found ${#descriptor_files[@]}"
            printf 'Found descriptor file: %s\n' "${descriptor_files[@]}"
            exit 1
          fi

          manifest_file=$(mktemp)
          jq -s '{
            schemaVersion: 2,
            mediaType: "application/vnd.docker.distribution.manifest.list.v2+json",
            manifests: .
          }' "${descriptor_files[@]}" > "$manifest_file"

          token=$(curl -fsSL -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPOSITORY}:pull,push" | jq -r '.token')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to obtain Docker Hub registry token"
            exit 1
          fi

          for attempt in {1..5}; do
            response_file=$(mktemp)
            http_code=$(curl -sS -o "$response_file" -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/vnd.docker.distribution.manifest.list.v2+json" \
              --data-binary "@$manifest_file" \
              "https://registry-1.docker.io/v2/${REPOSITORY}/manifests/${TAG}") || http_code="000"

            if [[ "$http_code" =~ ^2 ]]; then
              echo "Published ${REPOSITORY}:${TAG}"
              exit 0
            fi

            echo "Manifest push for $TAG failed with HTTP $http_code"
            cat "$response_file"
            if [[ "$http_code" != "429" && ! "$http_code" =~ ^5 ]]; then
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "Manifest push for $TAG failed on attempt $attempt; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done

          echo "Manifest push for $TAG failed after 5 attempts"
          exit 1
